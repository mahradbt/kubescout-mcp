[project]
name = "kubescout-mcp"
version = "0.1.0"
description = "Read-only Kubernetes MCP server built with FastMCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0", "kubernetes>=29.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kubescout-mcp = "kubescout_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
